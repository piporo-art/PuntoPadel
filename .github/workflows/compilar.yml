
name: Compilar Punto Padel APK

on:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          test -n "$ZIP" || { echo "ERROR: No se encontró el ZIP"; exit 1; }
          unzip -o "$ZIP" -d .

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
      - name: Preparar Android
        run: echo "Usando Android SDK preinstalado"

      
      - name: Instalar SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"


      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generar APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: PuntoPadel-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
